<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>理仁牙醫｜休診公告產生器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent: #7E8FAE;
  --title:  #4A6480;
  --text:   #3A4B5E;
  --muted:  #8A9AB0;
  --border: #C9D5E0;
  --bg:     #DDE6EE;
}

body {
  font-family: 'Noto Serif TC', system-ui, sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 24px 48px;
  gap: 20px;
}

.app-label {
  font-family: system-ui, sans-serif;
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0.08em;
}

.app-body {
  display: flex;
  gap: 44px;
  align-items: flex-start;
}

/* ── LEFT PANEL ── */
.left-panel {
  width: 288px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.tab-bar {
  display: flex;
  border: 2px solid var(--accent);
  border-radius: 8px;
  overflow: hidden;
}
.tab-btn {
  flex: 1;
  font-family: 'Noto Serif TC', sans-serif;
  font-size: 13px;
  padding: 9px 0;
  border: none;
  background: transparent;
  color: var(--accent);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.tab-btn:not(:last-child) { border-right: 2px solid var(--accent); }
.tab-btn.active { background: var(--accent); color: #fff; }
.tab-btn:not(.active):hover { background: rgba(126,143,174,0.10); }

.form-panel { display: none; flex-direction: column; gap: 11px; }
.form-panel.active { display: flex; }

.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-label {
  font-family: system-ui, sans-serif;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.04em;
}

input[type="date"] {
  font-family: 'Noto Serif TC', sans-serif;
  font-size: 14px;
  padding: 7px 10px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  background: #fff;
  color: var(--title);
  outline: none;
  width: 100%;
  transition: border-color 0.15s;
}
input[type="date"]:focus { border-color: var(--accent); }

/* Session checkboxes */
.session-checks {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 14px;
  padding: 6px 0;
}
.session-check {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: 'Noto Serif TC', sans-serif;
  font-size: 13px;
  color: var(--text);
  cursor: pointer;
  user-select: none;
}
.session-check input[type="checkbox"] {
  width: 15px;
  height: 15px;
  accent-color: var(--accent);
  cursor: pointer;
}

/* Dynamic date rows */
.date-rows {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.date-row {
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  background: #fff;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.date-row-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.date-row-num {
  font-family: system-ui, sans-serif;
  font-size: 11px;
  color: var(--muted);
}
.remove-btn {
  width: 22px;
  height: 22px;
  border: 1.5px solid var(--border);
  border-radius: 4px;
  background: #fff;
  color: var(--muted);
  font-size: 15px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  flex-shrink: 0;
  transition: background 0.12s, color 0.12s;
}
.remove-btn:hover { background: #FEE2E2; color: #B91C1C; border-color: #FECACA; }

.add-row-btn {
  font-family: 'Noto Serif TC', sans-serif;
  font-size: 13px;
  padding: 8px 0;
  background: transparent;
  color: var(--accent);
  border: 1.5px dashed var(--accent);
  border-radius: 6px;
  cursor: pointer;
  width: 100%;
  transition: background 0.15s;
}
.add-row-btn:hover { background: rgba(126,143,174,0.08); }

.divider { height: 1px; background: var(--border); }

.dl-btn {
  font-family: 'Noto Serif TC', sans-serif;
  font-size: 14px;
  padding: 11px 0;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  width: 100%;
  transition: background 0.15s;
}
.dl-btn:hover    { background: #8DA0BE; }
.dl-btn:disabled { background: #C0CDD8; cursor: default; }

/* ── CANVAS ── */
.canvas {
  position: relative;
  width: 600px;
  height: 600px;
  overflow: hidden;
  border-radius: 4px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.14);
  background-size: cover;
  background-position: center;
}

/* Content area – fixed 414px box, text centred inside, never drifts up */
.content-area {
  position: absolute;
  top: 170px;        /* 600 - 414 - 10 = 176 */
  left: 0;
  right: 0;
  height: 414px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.tpl { display: none; flex-direction: column; align-items: center; }
.tpl.active { display: flex; }

/* Multi-day lines */
.multi-lines {
  display: flex;
  flex-direction: column;
  gap: 0px;
  align-items: center;
}
.multi-line {
  font-family: 'Noto Serif TC', sans-serif;
  font-weight: 700;
  font-size: 28px;
  color: #606161;
  letter-spacing: 0.04em;
  line-height: 1.5;
  white-space: nowrap;
  text-align: center;
}

/* Single day */
.single-date {
  font-family: 'Noto Serif TC', sans-serif;
  font-weight: 700;
  font-size: 28px;
  color: #606161;
  letter-spacing: 0.04em;
  text-align: center;
  line-height: 1.5;
}
.single-line2,
.single-line3 {
  font-family: 'Noto Serif TC', sans-serif;
  font-weight: 700;
  font-size: 28px;
  color: #606161;
  letter-spacing: 0.04em;
  text-align: center;
  line-height: 1.5;
  margin-top: 0px;
}

/* B mode toggle */
.mode-row {
  display: flex;
  gap: 16px;
  padding: 2px 0;
}
.mode-opt {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: system-ui, sans-serif;
  font-size: 13px;
  color: var(--text);
  cursor: pointer;
}
.mode-opt input[type="radio"] { accent-color: var(--accent); cursor: pointer; }

/* Custom text input */
.custom-text-group { display: none; flex-direction: column; gap: 5px; }
.custom-text-group.show { display: flex; }
input[type="text"].custom-line {
  font-family: 'Noto Serif TC', sans-serif;
  font-size: 14px;
  padding: 7px 10px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  background: #fff;
  color: var(--title);
  outline: none;
  width: 100%;
  transition: border-color 0.15s;
}
input[type="text"].custom-line:focus { border-color: var(--accent); }

.copyright {
  font-family: system-ui, sans-serif;
  font-size: 11px;
  color: #B8C4CF;
  letter-spacing: 0.06em;
  margin-top: 8px;
}
</style>
</head>
<body>

<p class="app-label">理仁牙醫 休診公告產生器</p>

<div class="app-body">

  <!-- ════ LEFT PANEL ════ -->
  <aside class="left-panel">

    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('A')">多日不連續</button>
      <button class="tab-btn"        onclick="switchTab('B')">多日連續</button>
      <button class="tab-btn"        onclick="switchTab('C')">單日</button>
    </div>

    <!-- Form A: 多日不連續休診 -->
    <div class="form-panel active" id="form-A">
      <div id="date-rows" class="date-rows"></div>
      <button class="add-row-btn" onclick="addRow()">＋ 新增日期</button>
    </div>

    <!-- Form B: 多日連續休診 -->
    <div class="form-panel" id="form-B">
      <div class="form-group">
        <span class="form-label">開始日期</span>
        <input type="date" id="B-start" oninput="autoEndDate(); render()">
      </div>
      <div class="form-group">
        <span class="form-label">結束日期</span>
        <input type="date" id="B-end" oninput="render()">
      </div>
      <div class="form-group">
        <span class="form-label">休診時段</span>
        <div class="session-checks" id="B-sessions">
          <label class="session-check"><input type="checkbox" value="早診" onchange="handleCheck('B',this)">早診</label>
          <label class="session-check"><input type="checkbox" value="午診" onchange="handleCheck('B',this)">午診</label>
          <label class="session-check"><input type="checkbox" value="晚診" onchange="handleCheck('B',this)">晚診</label>
          <label class="session-check"><input type="checkbox" value="全天" onchange="handleAllDay('B',this)">全天</label>
        </div>
      </div>
      <div class="form-group">
        <span class="form-label">自訂文字（選填）</span>
        <input type="text" class="custom-line" id="B-line2" placeholder="自訂說明" oninput="render()">
      </div>
    </div>

    <!-- Form C: 單日休診 -->
    <div class="form-panel" id="form-C">
      <div class="form-group">
        <span class="form-label">休診日期</span>
        <input type="date" id="C-date" oninput="render()">
      </div>
      <div class="form-group">
        <span class="form-label">第二行模式</span>
        <div class="mode-row">
          <label class="mode-opt">
            <input type="radio" name="C-mode" value="session" checked onchange="switchCMode()">選時段（休診）
          </label>
          <label class="mode-opt">
            <input type="radio" name="C-mode" value="custom" onchange="switchCMode()">自訂文字
          </label>
        </div>
      </div>
      <!-- Session checkboxes (休診模式) -->
      <div class="form-group" id="C-session-group">
        <span class="form-label">休診時段</span>
        <div class="session-checks" id="C-sessions">
          <label class="session-check"><input type="checkbox" value="早診" onchange="handleCheck('C',this)">早診</label>
          <label class="session-check"><input type="checkbox" value="午診" onchange="handleCheck('C',this)">午診</label>
          <label class="session-check"><input type="checkbox" value="晚診" onchange="handleCheck('C',this)">晚診</label>
          <label class="session-check"><input type="checkbox" value="全天" onchange="handleAllDay('C',this)">全天</label>
        </div>
      </div>
      <!-- Custom text (自訂模式) -->
      <div class="custom-text-group" id="C-custom-group">
        <div class="form-group">
          <span class="form-label">第二行</span>
          <input type="text" class="custom-line" id="C-line2" placeholder="正常看診" oninput="render()">
        </div>
        <div class="form-group">
          <span class="form-label">第三行（選填）</span>
          <input type="text" class="custom-line" id="C-line3" placeholder="無休診" oninput="render()">
        </div>
      </div>
    </div>

    <div class="divider"></div>
    <button class="dl-btn" id="dl-btn" onclick="downloadPNG()">↓ 下載 PNG</button>

  </aside>

  <!-- ════ CANVAS ════ -->
  <main>
    <div class="canvas" id="the-canvas">

      <img id="bg-img" style="display:none" alt="">



      <!-- Content: centered on canvas -->
      <div class="content-area" id="content-area">

        <!-- A: 多日 -->
        <div class="tpl active" id="tpl-A">
          <div class="multi-lines" id="pv-A-lines"></div>
        </div>

        <!-- B: 多日連續 -->
        <div class="tpl" id="tpl-B">
          <div class="single-date"  id="pv-B-range"></div>
          <div class="single-line2" id="pv-B-session"></div>
          <div class="single-line3" id="pv-B-line2"></div>
        </div>

        <!-- C: 單日 -->
        <div class="tpl" id="tpl-C">
          <div class="single-date"  id="pv-C-date"></div>
          <div class="single-line2" id="pv-C-line2"></div>
          <div class="single-line3" id="pv-C-line3"></div>
        </div>

      </div>
    </div>
  </main>

</div>

<footer class="copyright">理仁牙醫診所</footer>

<script>
/* ──────────────────────────────────────────────
   Constants & State
────────────────────────────────────────────── */
const WEEKDAYS = ['日','一','二','三','四','五','六'];
const SESSION_ORDER = ['早診','午診','晚診'];
let current = 'A';
let rowCount = 0;

const $ = id => document.getElementById(id);
const val = id => $(id)?.value ?? '';

/* ──────────────────────────────────────────────
   Date helpers
────────────────────────────────────────────── */
function fmtDate(str) {
  if (!str) return '';
  const [y, m, d] = str.split('-').map(Number);
  const wd = new Date(y, m - 1, d).getDay();
  return `${m}/${String(d).padStart(2,'0')}(${WEEKDAYS[wd]})`;
}

function localDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function autoEndDate() {
  const s = val('B-start');
  if (s) $('B-end').value = addDays(s, 1);
}

function addDays(str, n) {
  const d = new Date(str + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return localDateStr(d);
}

/* ──────────────────────────────────────────────
   Session helpers
────────────────────────────────────────────── */
function getCheckedSessions(containerId) {
  const el = $(containerId);
  if (!el) return [];
  const all = el.querySelector('input[value="全天"]');
  if (all?.checked) return ['全天'];
  return SESSION_ORDER.filter(s => {
    const cb = Array.from(el.querySelectorAll('input[type="checkbox"]')).find(c => c.value === s);
    return cb?.checked;
  });
}

function formatSessions(sessions) {
  if (!sessions.length) return '';
  if (sessions.includes('全天')) return '全天';
  return sessions.join('、');
}

function handleCheck(formId, cb) {
  // If any partial session checked, uncheck 全天
  const container = formId === 'B' ? $('B-sessions') : cb.closest('.session-checks');
  if (cb.value !== '全天' && cb.checked) {
    const allDayCb = container.querySelector('input[value="全天"]');
    if (allDayCb) allDayCb.checked = false;
  }
  render();
}

function handleAllDay(formId, cb) {
  const container = formId === 'B' ? $('B-sessions') : cb.closest('.session-checks');
  if (cb.checked) {
    container.querySelectorAll('input[type="checkbox"]').forEach(c => {
      if (c.value !== '全天') c.checked = false;
    });
  }
  render();
}

/* ──────────────────────────────────────────────
   Dynamic row management (Template A)
────────────────────────────────────────────── */
function addRow() {
  const container = $('date-rows');
  if (container.children.length >= 4) return;
  const idx = ++rowCount;
  const dateVal = idx === 1 ? localDateStr(new Date()) : '';

  const div = document.createElement('div');
  div.className = 'date-row';
  div.id = `row-${idx}`;
  div.innerHTML = `
    <div class="date-row-header">
      <span class="date-row-num">日期 ${container.children.length + 1}</span>
      <button class="remove-btn" onclick="removeRow(${idx})" title="刪除">×</button>
    </div>
    <div class="form-group">
      <input type="date" id="row-date-${idx}" value="${dateVal}" oninput="render()">
    </div>
    <div class="session-checks" id="row-sessions-${idx}">
      <label class="session-check"><input type="checkbox" value="早診" onchange="handleCheck('row-${idx}',this)">早診</label>
      <label class="session-check"><input type="checkbox" value="午診" onchange="handleCheck('row-${idx}',this)">午診</label>
      <label class="session-check"><input type="checkbox" value="晚診" onchange="handleCheck('row-${idx}',this)">晚診</label>
      <label class="session-check"><input type="checkbox" value="全天" onchange="handleAllDay('row-${idx}',this)">全天</label>
    </div>`;
  container.appendChild(div);
  renumberRows();
  render();
}

function removeRow(idx) {
  const container = $('date-rows');
  if (container.children.length <= 1) return;
  const row = $(`row-${idx}`);
  if (row) row.remove();
  renumberRows();
  render();
}

function renumberRows() {
  const container = $('date-rows');
  Array.from(container.children).forEach((row, i) => {
    const numEl = row.querySelector('.date-row-num');
    if (numEl) numEl.textContent = `日期 ${i + 1}`;
  });
}

/* ──────────────────────────────────────────────
   Render preview
────────────────────────────────────────────── */
function render() {
  if (current === 'A') renderA();
  else if (current === 'B') renderB();
  else renderC();
}

function renderA() {
  const linesEl = $('pv-A-lines');
  linesEl.innerHTML = '';
  const rows = $('date-rows').querySelectorAll('.date-row');
  rows.forEach(row => {
    const rowId = row.id;
    const dateInput = row.querySelector('input[type="date"]');
    const dateStr = dateInput?.value || '';
    const sessions = getCheckedSessions(`row-sessions-${rowId.replace('row-','')}`);
    const dateFmt = fmtDate(dateStr);
    const sessionFmt = formatSessions(sessions);
    const text = dateFmt
      ? (sessionFmt ? `${dateFmt}　${sessionFmt}` : dateFmt)
      : '';
    const lineDiv = document.createElement('div');
    lineDiv.className = 'multi-line';
    lineDiv.textContent = text;
    linesEl.appendChild(lineDiv);
  });
}

function renderB() {
  const startStr = val('B-start');
  const endStr   = val('B-end');
  const startFmt = fmtDate(startStr);
  const endFmt   = fmtDate(endStr);
  $('pv-B-range').textContent = startFmt && endFmt
    ? `${startFmt} 〜 ${endFmt}`
    : (startFmt || endFmt || '');
  const sessions = getCheckedSessions('B-sessions');
  const sessionFmt = formatSessions(sessions);
  $('pv-B-session').textContent = sessionFmt ? sessionFmt + '休診' : '';
  $('pv-B-line2').textContent = val('B-line2');
}

function renderC() {
  const dateStr = val('C-date');
  $('pv-C-date').textContent = fmtDate(dateStr);
  const mode = document.querySelector('input[name="C-mode"]:checked')?.value ?? 'session';
  if (mode === 'session') {
    const sessions = getCheckedSessions('C-sessions');
    const sessionFmt = formatSessions(sessions);
    $('pv-C-line2').textContent = sessionFmt ? sessionFmt + '休診' : '';
    $('pv-C-line3').textContent = '';
  } else {
    $('pv-C-line2').textContent = val('C-line2');
    $('pv-C-line3').textContent = val('C-line3');
  }
}

function switchCMode() {
  const mode = document.querySelector('input[name="C-mode"]:checked')?.value ?? 'session';
  $('C-session-group').style.display = mode === 'session' ? '' : 'none';
  const cg = $('C-custom-group');
  if (mode === 'custom') cg.classList.add('show'); else cg.classList.remove('show');
  render();
}

/* ──────────────────────────────────────────────
   Tab switching
────────────────────────────────────────────── */
function switchTab(name) {
  current = name;
  document.querySelectorAll('.tab-btn').forEach((btn, i) =>
    btn.classList.toggle('active', ['A','B','C'][i] === name)
  );
  ['A','B','C'].forEach(id => {
    $('form-' + id)?.classList.toggle('active', id === name);
    $('tpl-'  + id)?.classList.toggle('active', id === name);
  });
  render();
}

/* ──────────────────────────────────────────────
   PNG DPI injection
────────────────────────────────────────────── */
const _crcTable = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let j = 0; j < 8; j++) c = (c & 1) ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[i] = c;
  }
  return t;
})();

function _crc32(buf, start, len) {
  let c = 0xFFFFFFFF;
  for (let i = start; i < start + len; i++) c = _crcTable[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function injectDPI(pngBlob, dpi) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const orig = new Uint8Array(e.target.result);
      const ppm  = Math.round(dpi / 0.0254);
      const phys = new Uint8Array(21);
      const dv   = new DataView(phys.buffer);
      dv.setUint32(0, 9);
      phys.set([0x70,0x48,0x59,0x73], 4);
      dv.setUint32(8,  ppm);
      dv.setUint32(12, ppm);
      phys[16] = 1;
      dv.setUint32(17, _crc32(phys, 4, 13));
      const out = new Uint8Array(orig.length + 21);
      out.set(orig.slice(0, 33));
      out.set(phys, 33);
      out.set(orig.slice(33), 54);
      resolve(new Blob([out], { type: 'image/png' }));
    };
    reader.readAsArrayBuffer(pngBlob);
  });
}

/* ──────────────────────────────────────────────
   Download PNG
────────────────────────────────────────────── */
async function downloadPNG() {
  const btn = $('dl-btn');
  btn.textContent = '產生中…';
  btn.disabled = true;
  try {
    const SCALE = 1.8;
    const SIZE  = Math.round(600 * SCALE); // 1080

    await document.fonts.ready;

    const oc  = document.createElement('canvas');
    oc.width  = oc.height = SIZE;
    const ctx = oc.getContext('2d');

    // Draw background
    ctx.drawImage($('bg-img'), 0, 0, SIZE, SIZE);

    const cvsRect = $('the-canvas').getBoundingClientRect();

    /* Draw text from a DOM element */
    function drawEl(id, color, fsPx, weight, lhRatio = 1.3, align = 'center') {
      const el = $(id);
      if (!el) return;
      const text = el.textContent.trim();
      if (!text) return;
      const r = el.getBoundingClientRect();
      ctx.fillStyle    = color;
      ctx.font         = `${weight} ${fsPx * SCALE}px 'Noto Serif TC', sans-serif`;
      ctx.textAlign    = align;
      ctx.textBaseline = 'top';
      const px = align === 'center'
        ? (r.left - cvsRect.left + r.width / 2) * SCALE
        : (r.left - cvsRect.left) * SCALE;
      const py   = (r.top - cvsRect.top) * SCALE;
      const lh   = fsPx * lhRatio * SCALE;
      const maxW = r.width * SCALE;
      function wrapLines(txt) {
        const out = [];
        for (const para of txt.split('\n')) {
          if (ctx.measureText(para).width <= maxW) { out.push(para); continue; }
          let line = '';
          for (const ch of para) {
            const test = line + ch;
            if (ctx.measureText(test).width > maxW && line) { out.push(line); line = ch; }
            else line = test;
          }
          if (line) out.push(line);
        }
        return out;
      }
      wrapLines(text).forEach((ln, i) => ctx.fillText(ln, px, py + i * lh));
    }

    /* Template content */
    const FS = 28;
    if (current === 'A') {
      const lines = $('pv-A-lines').querySelectorAll('.multi-line');
      lines.forEach(lineEl => {
        const text = lineEl.textContent.trim();
        if (!text) return;
        const lr = lineEl.getBoundingClientRect();
        ctx.fillStyle    = '#606161';
        ctx.font         = `700 ${FS * SCALE}px 'Noto Serif TC', sans-serif`;
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText(text,
          (lr.left - cvsRect.left + lr.width / 2) * SCALE,
          (lr.top  - cvsRect.top) * SCALE
        );
      });
    } else if (current === 'B') {
      drawEl('pv-B-range',   '#606161', FS, '700', 1.5);
      drawEl('pv-B-session', '#606161', FS, '700', 1.5);
      drawEl('pv-B-line2',   '#606161', FS, '700', 1.5);
    } else {
      drawEl('pv-C-date',  '#606161', FS, '700', 1.5);
      drawEl('pv-C-line2', '#606161', FS, '700', 1.5);
      drawEl('pv-C-line3', '#606161', FS, '700', 1.5);
    }

    /* Export */
    const firstDate = current === 'A'
      ? $('date-rows')?.querySelector('input[type="date"]')?.value
      : current === 'B' ? val('B-start') : val('C-date');
    const dateStr  = firstDate ? firstDate.replace(/-/g,'') : '日期';
    const filename = `理仁-${dateStr}-休診公告.png`;

    await new Promise(res => oc.toBlob(async rawBlob => {
      const dpiBlob = await injectDPI(rawBlob, 150);
      const a = document.createElement('a');
      a.download = filename;
      a.href = URL.createObjectURL(dpiBlob);
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      res();
    }, 'image/png'));

  } catch (err) {
    console.error(err);
    alert('下載失敗：' + err.message);
  }
  btn.textContent = '↓ 下載 PNG';
  btn.disabled = false;
}
